# Milestones 3/4/5 brought in the third-party backends our services depend on
# (tracing, database, metrics/dashboards) while the services themselves still
# ran on the host via `mvn spring-boot:run`. Milestone 9 is what this file's
# own comment always said would happen next: our own eight modules now build
# and run as containers on this same network too, with health-check-gated
# startup ordering and per-container CPU/memory quotas — so `docker compose up
# -d` alone brings up the entire platform, and a runaway container can't
# starve its neighbors on a shared host (Q39/Q40).

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  start_period: 150s
  retries: 10




services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: spendwise-zipkin
    ports:
      - "9411:9411"

  postgres:
    image: postgres:16-alpine
    container_name: spendwise-postgres
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
    ports:
      - "5432:5432"
    volumes:
      - spendwise-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    # Milestone 9 — the official postgres image ships no HEALTHCHECK of its
    # own, but auth/user/transaction/budget-service's `depends_on: condition:
    # service_healthy` below needs one to wait on: pg_isready is the same
    # readiness probe the postgres image itself uses internally to know when
    # to accept connections, not a custom script.
    # Milestone 17 fix — `-h 127.0.0.1` makes this a TCP check. Without it
    # pg_isready used the Unix socket, and on a fresh volume postgres's
    # entrypoint runs the initdb scripts on a temporary server that listens on
    # the socket only — so the container could report healthy while TCP
    # clients (postgres-db-init, every service) were still refused.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Milestone 17 fix (raised validating Milestone 15) — postgres runs
  # /docker-entrypoint-initdb.d only when its data volume is empty, so a
  # database added after the volume was first created (analytics_db at
  # Milestone 15) never appeared on an existing volume. This one-shot container
  # runs the same, now-idempotent, script on every `docker compose up` and exits;
  # every database-backed service waits for it to finish successfully
  # (service_completed_successfully) instead of only waiting for postgres to be
  # healthy. PGPASSWORD is the libpq-standard way to pass the password to psql
  # non-interactively.
  postgres-db-init:
    image: postgres:16-alpine
    container_name: spendwise-postgres-db-init
    environment:
      PGPASSWORD: spendwise
    volumes:
      - ./infra/postgres-init:/scripts:ro
    command: ["psql", "-h", "postgres", "-U", "spendwise", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/01-create-databases.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Milestone 17 — a three-node Apache Kafka cluster in KRaft mode (no
  # ZooKeeper): each node is both broker and controller (combined mode, the
  # layout of the official apache/kafka image's own multi-node example), and
  # the three controllers form the metadata quorum (KAFKA_CONTROLLER_QUORUM_VOTERS).
  # Three brokers, not one, because the topic below is created with
  # replication factor 3 and min.insync.replicas 2: an acks=all write is
  # acknowledged only once two replicas hold it, so one broker can be lost
  # without losing an acknowledged event or blocking the publisher.
  #
  # Listeners: PLAINTEXT (kafka-N:19092) is the in-network listener services
  # and inter-broker replication use; PLAINTEXT_HOST is published on the host
  # (29092/39092/49092) for host-run services and tools; CONTROLLER (9093) is
  # quorum-only and never published. All three nodes must share CLUSTER_ID.
  # Logs live inside the container (KAFKA_LOG_DIRS): `docker compose down`
  # discards topic data, which is acceptable here because the durable record
  # of every event is the outbox_events table, not the broker.
  kafka-1:
    image: apache/kafka:3.9.0
    container_name: spendwise-kafka-1
    hostname: kafka-1
    ports:
      - "29092:9092"
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Topics are provisioned explicitly (OutboxPublisher via KafkaAdmin), so
      # a typo'd topic name fails loudly instead of silently creating a
      # single-partition, single-replica topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    # A TCP connect to the in-network listener, via bash's /dev/tcp (no
    # extra tooling needed in the image). The Kafka CLI tools would also work
    # but each start a JVM, which is a heavy probe to run every 10s x 3 nodes.
    healthcheck: &kafka-healthcheck
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/19092'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped
    deploy: &kafka-deploy
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  kafka-2:
    image: apache/kafka:3.9.0
    container_name: spendwise-kafka-2
    hostname: kafka-2
    ports:
      - "39092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
    healthcheck: *kafka-healthcheck
    restart: unless-stopped
    deploy: *kafka-deploy

  kafka-3:
    image: apache/kafka:3.9.0
    container_name: spendwise-kafka-3
    hostname: kafka-3
    ports:
      - "49092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
    healthcheck: *kafka-healthcheck
    restart: unless-stopped
    deploy: *kafka-deploy

  # Milestone 17 — browser UI over the cluster (topics, partitions, messages
  # with their headers, consumer groups), used by the Postman validation plan
  # in place of Kafka CLI commands. Behind the "tools" profile, so a plain
  # `docker compose up -d` does not start it; start it with
  # `docker compose --profile tools up -d kafka-ui`. Dynamic config editing
  # is left off.
  # Milestone 20 — no longer read-only: the poison-pill chaos lab produces a
  # malformed record onto transaction-events through this UI (or its REST API,
  # which the Postman test plan calls). A local dev tool with no auth, so its
  # port is published on 127.0.0.1 only; never expose it like this elsewhere.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: spendwise-kafka-ui
    profiles: ["tools"]
    ports:
      # Milestone 20 — bound to loopback: the UI is writable and has no auth,
      # so it must not be reachable from other machines on the network.
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: spendwise
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  # Milestone 14 — backs api-gateway's RedisRateLimiter (config-repo/api-gateway.yml).
  # No password/persistence volume: this instance holds nothing but short-lived
  # token-bucket counters the Lua script underlying RedisRateLimiter maintains,
  # which are fine to lose on a restart, unlike postgres's durable application data.
  redis:
    image: redis:7-alpine
    container_name: spendwise-redis
    ports:
      - "6379:6379"
    # Same role as postgres's pg_isready above: api-gateway's `depends_on:
    # condition: service_healthy` needs a real readiness probe, and redis-cli
    # ping against the server redis itself ships is that probe, not a custom one.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: spendwise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    # Milestone 9 — scrape targets moved to compose service names (see
    # infra/prometheus/prometheus.yml), so the host.docker.internal bridge
    # Milestones 3-5 needed for host-run services is no longer relevant.

  grafana:
    image: grafana/grafana:latest
    container_name: spendwise-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: spendwise
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - spendwise-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------
  # Milestone 9 — SpendWise's own services, each built from its own
  # multi-stage Dockerfile (see e.g. auth-service/Dockerfile for the full
  # rationale every one of them shares). `context: .` is the monorepo root,
  # not the service's own directory, because Maven's reactor needs the whole
  # tree to resolve spendwise-common via `-am`.
  # ---------------------------------------------------------------------

  # Milestone 10 — the Eureka registry every other service self-registers
  # with. Deliberately absent from every other service's `depends_on` below:
  # unlike config-server, whose `fail-fast: true` makes it a hard synchronous
  # bootstrap dependency, Eureka client registration is asynchronous and
  # best-effort — a service starts fine without it and simply retries
  # registration in the background (Q41/Q42), so gating startup on it here
  # would misrepresent that distinction rather than fix a real problem.
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: spendwise-discovery-server
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      <<: *java-healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: spendwise-config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_HOST: discovery-server
    restart: unless-stopped
    healthcheck:
      <<: *java-healthcheck
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: spendwise-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      config-server:
        condition: service_healthy
      postgres-db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: spendwise-user-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      config-server:
        condition: service_healthy
      postgres-db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: spendwise-transaction-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Milestone 17 — in-network listeners of all three brokers (any one is
      # enough to bootstrap; listing all three survives one being down).
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      config-server:
        condition: service_healthy
      postgres-db-init:
        condition: service_completed_successfully
      # service_started, deliberately not service_healthy: transaction-service
      # must accept writes while Kafka is down (the outbox holds them), so the
      # cluster is started alongside it but never gates its startup.
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  budget-service:
    build:
      context: .
      dockerfile: budget-service/Dockerfile
    container_name: spendwise-budget-service
    ports:
      - "8084:8084"
      # Milestone 15 fix (made validating that milestone) — this block
      # originally published the gRPC port (grpc.server.port, config-repo/
      # budget-service.yml) onto host 9090, which collided with Prometheus's
      # own "9090:9090" above and was removed. Milestone 16 republishes it on
      # host 9095 instead (container port unchanged at 9090 — only the host
      # side is remapped) so Postman/grpcurl can reach it directly from the
      # host for manual validation, the same way every REST port here already
      # is; analytics-service itself is unaffected either way, since it
      # always addressed this over the compose network as
      # budget-service:9090 (config-repo/analytics-service.yml), never via a
      # host port.
      - "9095:9090"
    environment:
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Milestone 21 — budget-service consumes transaction-events and publishes
      # budget-events (the budget-breach saga).
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      config-server:
        condition: service_healthy
      postgres-db-init:
        condition: service_completed_successfully
      # service_started, as for transaction-service: the REST and gRPC budget
      # APIs stay up while Kafka is down; the consumer catches up when it returns.
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Milestone 18 — scalable for the consumer-group chaos lab
  # (`docker compose up -d --scale notification-service=4`), which is why it is
  # the one service with no container_name (Compose cannot give four
  # containers the same name; they become spendwise-notification-service-1..4)
  # and a host port *range*: each replica is published on its own host port
  # from 18085-18088, so Postman can ask each one which partitions it owns
  # (/actuator/kafkaassignments). Not 8085-8088: that range would overlap
  # analytics-service's 8086. With one replica it gets 18085; the container
  # port is still 8085, so in-network callers and Prometheus are unaffected.
  # Memory limit: 384M at Milestone 18, back to 512M at Milestone 19, when the
  # service gained JPA/Hibernate/Flyway (notification_db) — the same limit as
  # every other JPA service. Four replicas therefore need ~2 GB; see the README's
  # Docker memory note before the chaos lab.
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "18085-18088:8085"
    environment:
      # Milestone 19 — notification_db (processed_events + notification_log).
      # All replicas share it, which is what makes deduplication hold across
      # a rebalance: the new partition owner sees the old owner's claims.
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      # Overrides the Dockerfile's MaxRAMPercentage=75 (set at Milestone 18,
      # when this container's limit was 384M). Kept at 60% with the 512M limit
      # so ~200M stays outside the heap for metaspace (Hibernate's classes
      # included), threads and buffers.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-db-init:
        condition: service_completed_successfully
      # Started with, not gated on, the cluster: a consumer that starts before
      # the brokers are reachable simply keeps retrying and joins once they are.
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: spendwise-analytics-service
    ports:
      - "8086:8086"
    environment:
      # Milestone 15 — analytics-service gains real Postgres persistence
      # (dashboard_query_log via R2DBC) for the first time; same ${VAR:localhost}
      # override pattern DB_HOST has used for every other *_db-backed service
      # since Milestone 4.
      DB_HOST: postgres
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Milestone 15 — overrides config-repo/analytics-service.yml's
      # `localhost:9090` static gRPC target default with budget-service's own
      # compose service name, the same *_SERVICE_HOST override pattern
      # api-gateway's own Feign/HTTP routes have used since Milestone 9.
      BUDGET_SERVICE_HOST: budget-service
      # Milestone 18 — in-network listeners of the three brokers, for this
      # service's own consumer group on transaction-events.
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      config-server:
        condition: service_healthy
      postgres-db-init:
        condition: service_completed_successfully
      budget-service:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: spendwise-api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: discovery-server
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Milestone 9 — overrides the `localhost:<port>` defaults in
      # config-repo/api-gateway.yml with each downstream service's own
      # compose service name, exactly the same `${VAR:localhost}` pattern
      # `DB_HOST` has used since Milestone 4.
      AUTH_SERVICE_HOST: auth-service
      USER_SERVICE_HOST: user-service
      TRANSACTION_SERVICE_HOST: transaction-service
      BUDGET_SERVICE_HOST: budget-service
      NOTIFICATION_SERVICE_HOST: notification-service
      ANALYTICS_SERVICE_HOST: analytics-service
      # Milestone 14 — overrides config-repo/api-gateway.yml's `localhost`
      # default with the redis container's own compose service name, the
      # exact same override pattern every *_SERVICE_HOST entry above already
      # follows for api-gateway's downstream HTTP dependencies.
      REDIS_HOST: redis
    depends_on:
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      <<: *java-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  spendwise-postgres-data:
  spendwise-grafana-data:
