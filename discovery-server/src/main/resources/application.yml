spring:
  application:
    name: discovery-server

server:
  port: 8761

# Milestone 10 — this instance is the registry itself, so it must not try to
# register with or pull a peer list from itself the way every other service's
# eureka.client block (config-repo/application.yml) does. A real multi-node
# Eureka cluster flips both of these to true and points defaultZone at its
# peers instead; a single standalone instance is enough for this platform.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,deadlock

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "
