logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "

management:
  observations:
    enable:
      spring.security: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,deadlock

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    openfeign:
      client:
        config:
          # Milestone 11 — "default" applies platform-wide to every Feign client,
          # present or future, not just today's one named "user-service" client
          # (Q41/Q42's Milestone 10 UserServiceClient) — centralized here for the
          # same reason Eureka's defaultZone is: it's inert on the five services
          # with no Feign client on their classpath and picked up by whichever
          # ones do. connect-timeout is generous (TCP handshake to a sibling
          # container on the same compose network should be near-instant);
          # read-timeout is deliberately tight — the Chaos Lab in the README
          # walks through why 1.5s specifically, and what happens without it
          # (Q43/Q44).
          default:
            connect-timeout: 2000
            read-timeout: 1500

# Milestone 11 — layered over the read-timeout above: a request that fails fast
# at 1.5s because the network hiccuped (not because user-service is actually
# down or overloaded) is worth one quick retry rather than surfacing an error
# for a blip. Deliberately scoped to this platform's one idempotent GET lookup
# (Q45 — retrying a non-idempotent write could double-apply it, and retrying
# indiscriminately on every FeignException would retry a legitimate 404 three
# times for no reason); retry-exceptions is narrowed to feign.RetryableException
# specifically, the type Feign wraps connect/read-timeout and other I/O
# failures in, so ResourceNotFoundException's cause (FeignException.NotFound)
# is never retried. Exponential backoff plus randomized jitter (rather than a
# fixed delay) avoids every concurrently-retrying caller hammering user-service
# again at the exact same instant (a self-inflicted thundering herd). Note this
# is intentionally incomplete on its own — a genuinely overloaded (not just
# blip-y) user-service would have every caller retrying into it, which is
# exactly the failure mode Milestone 12's Circuit Breaker exists to cut off.
resilience4j:
  retry:
    instances:
      userServiceLookup:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - feign.RetryableException
        # Milestone 12 — keeps a 404 out of the retry DECISION only: it is
        # never retried (retrying "no such user" three times is pointless).
        # This does NOT, by itself, keep a 404 away from
        # UserServiceClient.getByIdFallback — Resilience4j-Spring's
        # fallback-routing wrapper invokes fallbackMethod for any exception
        # the call ultimately produces, ignore-exceptions or not. The actual
        # guard against a 404 being misclassified as "user-service
        # unavailable" lives in getByIdFallback itself (an explicit
        # instanceof FeignException.NotFound rethrow) — see its Javadoc.
        # Harmless no-op for budget-service today, which has no fallback of
        # its own yet.
        ignore-exceptions:
          - feign.FeignException$NotFound

spendwise:
  security:
    # Shared only between the API Gateway (signs) and business services (verify) —
    # HMAC key for the X-User-Context header (Milestone 6). Override via env var
    # in any real deployment; the default here is dev-only.
    user-context-secret: ${SPENDWISE_USER_CONTEXT_SECRET:dev-only-shared-secret-change-for-real-deployments}

eureka:
  client:
    service-url:
      # Milestone 10 — every business service and the API Gateway consume this
      # config-repo file, so registering with Eureka is wired here once instead
      # of eight times; ${EUREKA_HOST:localhost} mirrors the exact
      # `${VAR:localhost}` override pattern DB_HOST/CONFIG_SERVER_URL already
      # use for the same host-vs-container-name split between an IDE run and
      # docker-compose.yml.
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    # Critical in Docker: without this, a service registers under its
    # container hostname, which is frequently unresolvable by *other*
    # containers trying to call it back via Feign/LoadBalancer. Registering
    # the container's actual IP instead makes every instance directly
    # routable on the compose network (Q41/Q42).
    prefer-ip-address: true
