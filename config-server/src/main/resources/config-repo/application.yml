logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "

management:
  observations:
    enable:
      spring.security: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,deadlock

spring:
  # Milestone 18 — Kafka client settings shared by every service that talks to
  # the cluster, set once here instead of per service. Inert in services
  # without spring-kafka on the classpath. bootstrap-servers moved here from
  # transaction-service.yml (Milestone 17): the ${VAR:...} default lists the
  # three brokers' host-published ports for `mvn spring-boot:run`;
  # docker-compose.yml sets KAFKA_BOOTSTRAP_SERVERS to the in-network listeners.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    consumer:
      # One consumer group per service, named after the service: two services
      # on the same topic each receive every record (independent groups);
      # replicas of one service share the records (one group).
      group-id: ${spring.application.name}
      # Where a group with no committed offset starts. earliest = from the
      # beginning of the topic, so a group's first start (or a newly added
      # consumer service) sees events published before it existed.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Incremental (cooperative) rebalancing: when a member joins or leaves,
        # only the partitions that must move are revoked; everyone else keeps
        # consuming through the rebalance. The eager default stops the whole
        # group, revokes every partition, and reassigns from scratch.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        # How long the group waits for a member that stopped heartbeating
        # (killed, not shut down cleanly) before reassigning its partitions.
        # 10s instead of the 45s client default, so the chaos lab's kill is
        # observable in seconds; heartbeat at roughly a third of it.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      # Commit each record's offset right after it is processed, so a crash
      # redelivers at most the record in flight rather than the rest of a
      # polled batch. Still at-least-once: Milestone 19 handles the redelivery.
      ack-mode: record
      # One consumer thread per instance, so "instances" and "group members"
      # are the same number — the chaos lab's four instances are four members.
      concurrency: 1
      # Continues the producer's trace from the record's traceparent header
      # (KafkaTemplate observation, Milestone 17): publish and consume are one
      # trace in Zipkin.
      observation-enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cloud:
    loadbalancer:
      retry:
        # Milestone 13 fix (caught validating Milestone 12) — Spring Cloud
        # LoadBalancer wraps every load-balanced RestClient/Feign call in its
        # OWN retry layer by default, completely independent of and unaware of
        # Resilience4j's @Retry below. The two stacked silently: each
        # Resilience4j retry attempt was itself being retried again by
        # LoadBalancer underneath, multiplying the configured max-attempts: 3
        # into up to 9 real HTTP attempts — a failure that should have surfaced
        # in ~5s (3 attempts with backoff) instead took 9.6s. Resilience4j's
        # Retry is the platform's single, intentionally-tuned (backoff +
        # jitter) retry policy for this call; LoadBalancer's own retry is
        # redundant on top of it and disabled platform-wide here rather than
        # per-client, since any future load-balanced client should get the
        # same single-layer-of-retry guarantee.
        enabled: false
    openfeign:
      client:
        config:
          # Milestone 11 — "default" applies platform-wide to every Feign client,
          # present or future, not just today's one named "user-service" client
          # (Q41/Q42's Milestone 10 UserServiceClient) — centralized here for the
          # same reason Eureka's defaultZone is: it's inert on the five services
          # with no Feign client on their classpath and picked up by whichever
          # ones do. connect-timeout is generous (TCP handshake to a sibling
          # container on the same compose network should be near-instant);
          # read-timeout is deliberately tight — the Chaos Lab in the README
          # walks through why 1.5s specifically, and what happens without it
          # (Q43/Q44).
          default:
            connect-timeout: 2000
            read-timeout: 1500

# Milestone 11 — layered over the read-timeout above: a request that fails fast
# at 1.5s because the network hiccuped (not because user-service is actually
# down or overloaded) is worth one quick retry rather than surfacing an error
# for a blip. Deliberately scoped to this platform's one idempotent GET lookup
# (Q45 — retrying a non-idempotent write could double-apply it, and retrying
# indiscriminately on every FeignException would retry a legitimate 404 three
# times for no reason); retry-exceptions is narrowed to feign.RetryableException
# specifically, the type Feign wraps connect/read-timeout and other I/O
# failures in, so ResourceNotFoundException's cause (FeignException.NotFound)
# is never retried. Exponential backoff plus randomized jitter (rather than a
# fixed delay) avoids every concurrently-retrying caller hammering user-service
# again at the exact same instant (a self-inflicted thundering herd). Note this
# is intentionally incomplete on its own — a genuinely overloaded (not just
# blip-y) user-service would have every caller retrying into it, which is
# exactly the failure mode Milestone 12's Circuit Breaker exists to cut off.
resilience4j:
  retry:
    instances:
      userServiceLookup:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - feign.RetryableException
        # Milestone 12 — keeps a 404 out of the retry DECISION only: it is
        # never retried (retrying "no such user" three times is pointless).
        # This does NOT, by itself, keep a 404 away from
        # UserServiceClient.getByIdFallback — Resilience4j-Spring's
        # fallback-routing wrapper invokes fallbackMethod for any exception
        # the call ultimately produces, ignore-exceptions or not. The actual
        # guard against a 404 being misclassified as "user-service
        # unavailable" lives in getByIdFallback itself (an explicit
        # instanceof FeignException.NotFound rethrow) — see its Javadoc.
        # Harmless no-op for budget-service today, which has no fallback of
        # its own yet.
        ignore-exceptions:
          - feign.FeignException$NotFound
  timelimiter:
    instances:
      # Milestone 13 — same instance name as the retry/circuit-breaker
      # policies above, deliberately: all three names the one logical
      # protected operation (transaction-service's user-existence lookup),
      # even though this one piece of config only takes effect through
      # AsyncUserServiceLookup's new wrapper method, not UserServiceClient
      # itself (see that class's Javadoc for why a @TimeLimiter can't be
      # declared directly on a @FeignClient method at all). Sits here in the
      # shared file, not transaction-service's own application.yml, on the
      # same "every Feign client" reasoning Milestone 11's timeouts used —
      # budget-service gets this instance name available too the day it grows
      # its own async wrapper, with nothing to configure twice.
      userServiceLookup:
        # Must exceed the Retry+CircuitBreaker chain's own worst-case
        # duration underneath it, or this becomes the thing that cuts retries
        # off early rather than a true outer ceiling: 3 attempts, each up to
        # the 1.5s read-timeout above, plus two backoff waits (200ms and
        # ~400ms before jitter) between them, is already close to 5s in the
        # worst case the Milestone 11 pending-fix note measured directly
        # (9.6s before disabling the duplicated LoadBalancer retry; ~5s is
        # the real, single-layer worst case this is bounding). 7s leaves
        # comfortable headroom above that while still being a real,
        # meaningful ceiling — not "so large it can never fire."
        timeout-duration: 7s
        cancel-running-future: true

spendwise:
  # Milestone 18 — topic names consumers subscribe to (@KafkaListener topics
  # placeholders). transaction-service's producer reads its own topic from
  # spendwise.outbox.publisher.topic; both must say transaction-events.
  kafka:
    topics:
      transaction-events: transaction-events
    # Milestone 20 — every listener's bounded retry policy before a failed
    # record is published to <topic>.DLT (SpendwiseKafkaConsumerAutoConfiguration).
    # 3 retries x 1s: a poison record holds its partition for ~3s, then moves aside.
    error-handling:
      max-retries: 3
      retry-interval: 1s
  security:
    # Shared only between the API Gateway (signs) and business services (verify) —
    # HMAC key for the X-User-Context header (Milestone 6). Override via env var
    # in any real deployment; the default here is dev-only.
    user-context-secret: ${SPENDWISE_USER_CONTEXT_SECRET:dev-only-shared-secret-change-for-real-deployments}

eureka:
  client:
    service-url:
      # Milestone 10 — every business service and the API Gateway consume this
      # config-repo file, so registering with Eureka is wired here once instead
      # of eight times; ${EUREKA_HOST:localhost} mirrors the exact
      # `${VAR:localhost}` override pattern DB_HOST/CONFIG_SERVER_URL already
      # use for the same host-vs-container-name split between an IDE run and
      # docker-compose.yml.
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    # Critical in Docker: without this, a service registers under its
    # container hostname, which is frequently unresolvable by *other*
    # containers trying to call it back via Feign/LoadBalancer. Registering
    # the container's actual IP instead makes every instance directly
    # routable on the compose network (Q41/Q42).
    prefer-ip-address: true
