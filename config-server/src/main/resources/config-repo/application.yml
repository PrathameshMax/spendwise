logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "

management:
  observations:
    enable:
      spring.security: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,deadlock

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

spendwise:
  security:
    # Shared only between the API Gateway (signs) and business services (verify) —
    # HMAC key for the X-User-Context header (Milestone 6). Override via env var
    # in any real deployment; the default here is dev-only.
    user-context-secret: ${SPENDWISE_USER_CONTEXT_SECRET:dev-only-shared-secret-change-for-real-deployments}

eureka:
  client:
    service-url:
      # Milestone 10 — every business service and the API Gateway consume this
      # config-repo file, so registering with Eureka is wired here once instead
      # of eight times; ${EUREKA_HOST:localhost} mirrors the exact
      # `${VAR:localhost}` override pattern DB_HOST/CONFIG_SERVER_URL already
      # use for the same host-vs-container-name split between an IDE run and
      # docker-compose.yml.
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    # Critical in Docker: without this, a service registers under its
    # container hostname, which is frequently unresolvable by *other*
    # containers trying to call it back via Feign/LoadBalancer. Registering
    # the container's actual IP instead makes every instance directly
    # routable on the compose network (Q41/Q42).
    prefer-ip-address: true
