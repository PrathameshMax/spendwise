logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId},%X{traceId:-},%X{spanId:-}]"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
