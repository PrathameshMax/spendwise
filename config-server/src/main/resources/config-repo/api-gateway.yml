spendwise:
  gateway:
    # Milestone 9 — each host is parameterized the same way `DB_HOST` has been
    # since Milestone 4 (`${VAR:localhost}`): the `localhost:<port>` default
    # keeps every route working unchanged when api-gateway runs on the host via
    # `mvn spring-boot:run` against services also running on the host, while
    # docker-compose.yml overrides each *_SERVICE_HOST env var to the target
    # service's own compose service name once api-gateway and every business
    # service become separate containers — "localhost" inside a container
    # means that container itself, never a sibling one.
    routes:
      auth-service: http://${AUTH_SERVICE_HOST:localhost}:8081
      user-service: http://${USER_SERVICE_HOST:localhost}:8082
      transaction-service: http://${TRANSACTION_SERVICE_HOST:localhost}:8083
      budget-service: http://${BUDGET_SERVICE_HOST:localhost}:8084
      # notification-service has no business route (its first inbound path is a
      # Kafka listener); its entry exists so RouteConfig's docs-proxy loop can
      # expose its OpenAPI document. analytics-service got its business route
      # (/api/v1/analytics/**) in the Milestone 17 fix — Milestone 15 added the
      # endpoint but not the route.
      notification-service: http://${NOTIFICATION_SERVICE_HOST:localhost}:8085
      analytics-service: http://${ANALYTICS_SERVICE_HOST:localhost}:8086
  # Milestone 17 fix — how many proxies in front of the Gateway append to
  # X-Forwarded-For (RateLimitConfig#clientKeyResolver). 1 = one load balancer
  # in front, which is the deployment this setting assumes. With the Gateway
  # exposed directly (docker compose on a laptop, nothing in front), every
  # X-Forwarded-For value is client-supplied; set this to 0 there to key
  # anonymous traffic on the socket address only.
  rate-limit:
    trusted-proxy-hops: 1
  security:
    jwk-set-uri: http://${AUTH_SERVICE_HOST:localhost}:8081/oauth2/jwks
    refresh-cookie-name: spendwise_refresh_token
    refresh-cookie-path: /api/v1/auth/refresh
    refresh-cookie-max-age-seconds: 604800

springdoc:
  swagger-ui:
    # Milestone 7 — one Swagger UI at the Gateway aggregating every service's
    # own OpenAPI document, fetched same-origin through RouteConfig's docs-proxy
    # routes (avoids the cross-origin fetch Swagger UI's browser JS would
    # otherwise need to make against each service's own port).
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: transaction-service
        url: /v3/api-docs/transaction-service
      - name: budget-service
        url: /v3/api-docs/budget-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: analytics-service
        url: /v3/api-docs/analytics-service

spring:
  webflux:
    # api-gateway has no custom @RestController of its own throwing SpendWiseException
    # types, so it doesn't need a servlet-only @RestControllerAdvice like the
    # business services got in Milestone 7 — this built-in Spring Boot flag gives
    # WebFlux's own default error responses the same RFC 7807 ProblemDetail shape
    # instead, keeping the error format consistent platform-wide with no custom code.
    problemdetails:
      enabled: true
  data:
    redis:
      # Milestone 14 — same ${VAR:localhost} pattern every other per-service
      # backend host has used since Milestone 4's DB_HOST default: the
      # Gateway reaches Redis unchanged when it runs on the host via `mvn
      # spring-boot:run`, while docker-compose.yml overrides REDIS_HOST to
      # the redis container's own compose service name once this runs
      # containerized — exactly like every *_SERVICE_HOST override above.
      host: ${REDIS_HOST:localhost}
      port: 6379
      # Milestone 17 fix — 1000ms -> 200ms, plus connect-timeout. A rate-limit
      # check is one Lua EVAL against a co-located Redis (sub-millisecond when
      # healthy), so 200ms is still ~100x headroom while capping what a
      # degraded Redis can add to every request. Together with Lettuce's
      # REJECT_COMMANDS (RateLimitConfig#rejectCommandsWhileDisconnected),
      # which handles the fully-down case without waiting at all.
      connect-timeout: 200ms
      # Explicit, same "never trust an external dependency without a bound"
      # reasoning as every other I/O timeout in this platform (Milestone
      # 11's Feign defaults, Milestone 13's exchange-rate WebClient): a
      # degraded (not cleanly down) Redis leaves the rate limiter's Lua
      # script round trip with nothing bounding its own latency, so a
      # struggling Redis queues every gated request behind it instead of
      # either allowing or denying them promptly — a real, reported failure
      # mode (spring-cloud/spring-cloud-gateway#3373), not a hypothetical one.
      timeout: 200ms
  # Milestone 14 fix (caught validating Milestone 14 itself, before any
  # pending-fixes list even came into it) — spring.cloud.gateway.default-
  # filters used to carry a RequestRateLimiter entry here
  # (redis-rate-limiter.replenishRate/burstCapacity/requestedTokens, 10/20/1,
  # key-resolver pointing at RateLimitConfig#remoteAddressKeyResolver). Live
  # testing disproved it: a default-filter only attaches to routes sourced
  # from a RouteDefinitionLocator (YAML/properties-defined routes) — every
  # route in this platform is instead built via RouteLocatorBuilder's Java
  # fluent DSL in RouteConfig, which default-filters silently never touches
  # (confirmed against spring-cloud-gateway#3121, a maintainer-acknowledged
  # report of the exact same mismatch). Redis itself connected fine
  # (/actuator/health reported it UP), but 25 requests past the configured
  # burst capacity all still reached auth-service, and `redis-cli KEYS
  # 'request_rate_limiter.*'` came back empty — proof the filter was
  # configured but never actually invoked. The real fix is now in code:
  # RateLimitConfig declares an explicit RedisRateLimiter bean (same 10/20/1
  # values, now set via its constructor rather than filter args, since
  # RequestRateLimiterGatewayFilterFactory.Config exposes only
  # setRateLimiter/setKeyResolver — see its Javadoc for the full trail), and
  # RouteConfig applies it to every declared route directly. Left removed
  # here rather than kept alongside the real fix as redundant, inert config
  # that would misleadingly suggest it's doing something — the same call
  # Milestone 13 already made for DedupeResponseHeader below.
  # Milestone 13 fix — DedupeResponseHeader=X-Correlation-ID, RETAIN_FIRST used
  # to live here as a default-filter, but live testing kept showing the header
  # duplicated anyway: this filter's dedup logic runs in its own post-phase,
  # which does not reliably land after Gateway's own internal step that copies
  # the proxied response's headers (including the downstream service's own
  # echoed X-Correlation-ID) onto the exchange. The actual fix is now in code —
  # CorrelationIdGlobalFilter decorates the response to set() the header at
  # the real write-commit point, which this config-only filter could not
  # guarantee. Left removed rather than kept alongside the real fix as
  # redundant, unreliable config that would misleadingly suggest it's doing
  # something.