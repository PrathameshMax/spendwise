spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/auth_db
    username: ${DB_USERNAME:spendwise}
    password: ${DB_PASSWORD:spendwise}
  flyway:
    enabled: true

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

spendwise:
  security:
    # Milestone 6 — auth-service's own token lifetimes, distinct from the
    # Gateway-side refresh-cookie settings in config-repo/api-gateway.yml.
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
