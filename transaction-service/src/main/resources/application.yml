spring:
  application:
    name: transaction-service
  profiles:
    active: dev
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 10

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

# Milestone 12 — scoped to this service only (not centralized in
# config-repo/application.yml the way Milestone 11's timeouts/retry are):
# the roadmap applies @CircuitBreaker specifically to "the Transaction→User
# cross-service call," not budget-service's copy, so this policy belongs here
# rather than implying it's a platform-wide default.
resilience4j:
  circuitbreaker:
    instances:
      userServiceLookup:
        sliding-window-type: COUNT_BASED
        # Of the last 10 calls, at least 5 must have actually happened
        # (minimum-number-of-calls) before a failure rate is even computed —
        # otherwise the very first unlucky call could trip the breaker off a
        # 100%-of-1 sample.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # OPEN for 10s before a trial call is let through automatically
        # (rather than waiting for the next caller to arrive and trigger the
        # transition check), then up to 3 trial calls decide CLOSED vs OPEN
        # again.
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Same reasoning as the Retry ignore-exceptions above: a 404 is a
        # correct, healthy answer from user-service, not a failure — it must
        # never count against this circuit's failure-rate window. Note this
        # is purely about the circuit's own bookkeeping — it does not, by
        # itself, stop a 404 from reaching UserServiceClient.getByIdFallback;
        # that guard is the explicit instanceof check inside the fallback
        # method itself (see its Javadoc).
        ignore-exceptions:
          - feign.FeignException$NotFound
  bulkhead:
    thread-pool-instances:
      # Milestone 13 — scoped here, not config-repo/application.yml: unlike
      # Retry/CircuitBreaker's userServiceLookup (an internal, Eureka-resolved
      # sibling call every business service could plausibly make), this
      # protects one specific external third-party integration that only
      # transaction-service has, exactly the same "service-local, not a
      # platform default" reasoning Milestone 12 already applied to this same
      # file's circuitbreaker block above.
      exchangeRateLookup:
        # A small, intentionally modest pool: this call is not expected to be
        # hot-path/high-volume (most transactions are presumably in the
        # user's own base currency and skip it via convertIfNeeded's
        # short-circuit), so sizing it generously would just reserve threads
        # that mostly sit idle. core vs max lets it burst briefly under
        # genuine concurrent load before queuing; queue-capacity bounds how
        # many callers wait rather than fail fast once the pool itself is
        # saturated — past that, BulkheadFullException routes straight to
        # the fallback (Q48).
        core-thread-pool-size: 5
        max-thread-pool-size: 10
        queue-capacity: 20
        keep-alive-duration: 20ms

# Milestone 13 — externalized rather than hardcoded in ExchangeRateWebClientConfig,
# the same pattern every other per-service, non-shared setting in this file
# follows (DB_HOST, server.port, ...): free, keyless public API (see
# ExchangeRateApiResponse's Javadoc for the one caveat on its exact response
# shape). connect/read timeouts mirror Milestone 11's OpenFeign defaults
# (config-repo/application.yml) — the same "fail fast against a dependency
# that could just be slow" reasoning applies equally to a third party as to a
# sibling service.
spendwise:
  exchange-rate:
    base-url: https://open.er-api.com
    connect-timeout-ms: 2000
    read-timeout-ms: 1500
