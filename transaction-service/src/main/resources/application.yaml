server:
  port: 8082


spring:
  application:
    name: transaction-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/spendwise

  datasource:
    url: jdbc:postgresql://localhost:5432/spendwise_transaction
    username: nexaadmin
    password: Nexa@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      show-details: when_authorized
      probes:
        enabled: true