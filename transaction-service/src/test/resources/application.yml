spring:
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  config:
    import: ""
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

spendwise:
  exchange-rate:
    base-url: http://localhost:0
    connect-timeout-ms: 2000
    read-timeout-ms: 1500
  security:
    resource-server:
      issuer: http://localhost:8180/realms/spendwise
      jwk-set-uri: http://localhost:8180/realms/spendwise/protocol/openid-connect/certs
      audience: spendwise-api
  kafka:
    topics:
      transaction-events: transaction-events
      budget-events: budget-events
  outbox:
    publisher:
      enabled: false