spring:
  application:
    name: auth-service
  profiles:
    active: dev
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 10

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
