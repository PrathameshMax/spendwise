spring:
  application:
    name: gateway-service

server:
  port: ${GATEWAY_SERVER_PORT:8088}

spendwise:
  services:
    user:
      url: ${USER_SERVICE_URL:http://localhost:8081}
    transaction:
      url: ${TRANSACTION_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: SpendWise Gateway
    description: API Gateway for SpendWise microservices
    version: 1.0.0