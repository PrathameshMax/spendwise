spring:
  application:
    name: gateway-service

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: SpendWise Gateway
    description: API Gateway for SpendWise microservices
    version: 1.0.0