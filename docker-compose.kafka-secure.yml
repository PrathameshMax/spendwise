# Hop ⑤ — Kafka secured with TLS + SASL + topic ACLs. Opt-in overlay:
#
#   bash infra/kafka/secure/generate-certs.sh
#   docker compose -f docker-compose.yml -f docker-compose.kafka-secure.yml up -d
#
# - Every client listener is SASL_SSL: traffic is encrypted, the broker proves its
#   identity with a certificate signed by the dev CA, and each client logs in as
#   its own principal (SASL/PLAIN over TLS; SCRAM in a managed cluster).
# - StandardAuthorizer with allow.everyone.if.no.acl.found=false: a principal can
#   only do what infra/kafka/secure/create-acls.sh grants it.
# - The controller quorum listener stays PLAINTEXT on the private network only
#   (ANONYMOUS is therefore a super user); production would use SSL there too.
# Listener names (INTERNAL/EXTERNAL) deliberately differ from protocol names.
# Passwords below are dev defaults; in a real deployment they come from Vault.

x-kafka-secure-env: &kafka-secure-env
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
  KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
  KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: &broker-jaas >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin" password="${KAFKA_ADMIN_PASSWORD:-dev-kafka-admin-secret}"
    user_admin="${KAFKA_ADMIN_PASSWORD:-dev-kafka-admin-secret}"
    user_svc_transaction="${KAFKA_TRANSACTION_PASSWORD:-dev-kafka-transaction-secret}"
    user_svc_budget="${KAFKA_BUDGET_PASSWORD:-dev-kafka-budget-secret}"
    user_svc_notification="${KAFKA_NOTIFICATION_PASSWORD:-dev-kafka-notification-secret}"
    user_svc_analytics="${KAFKA_ANALYTICS_PASSWORD:-dev-kafka-analytics-secret}"
    user_schema_registry="${KAFKA_SCHEMA_REGISTRY_PASSWORD:-dev-kafka-schema-registry-secret}";
  KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *broker-jaas
  KAFKA_SSL_KEYSTORE_TYPE: PEM
  KAFKA_SSL_TRUSTSTORE_TYPE: PEM
  KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.pem
  KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS

x-kafka-client-volume: &kafka-client-volume
  - ./infra/kafka/secure/secrets/kafka.truststore.pem:/etc/kafka/secrets/kafka.truststore.pem:ro

services:
  kafka-1:
    environment:
      <<: *kafka-secure-env
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:29092
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-1.keystore.pem
    volumes:
      - ./infra/kafka/secure/secrets:/etc/kafka/secrets:ro

  kafka-2:
    environment:
      <<: *kafka-secure-env
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:39092
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-2.keystore.pem
    volumes:
      - ./infra/kafka/secure/secrets:/etc/kafka/secrets:ro

  kafka-3:
    environment:
      <<: *kafka-secure-env
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:49092
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka-3.keystore.pem
    volumes:
      - ./infra/kafka/secure/secrets:/etc/kafka/secrets:ro

  kafka-acl-init:
    image: apache/kafka:3.9.0
    container_name: spendwise-kafka-acl-init
    entrypoint: ["/bin/bash", "/scripts/create-acls.sh"]
    volumes:
      - ./infra/kafka/secure:/scripts:ro
      - ./infra/kafka/secure/secrets:/etc/kafka/secrets:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"

  schema-registry:
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SASL_SSL://kafka-1:19092,SASL_SSL://kafka-2:19092,SASL_SSL://kafka-3:19092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SASL_SSL
      SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: PLAIN
      SCHEMA_REGISTRY_KAFKASTORE_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="schema_registry" password="${KAFKA_SCHEMA_REGISTRY_PASSWORD:-dev-kafka-schema-registry-secret}";
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_TYPE: PEM
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.pem
      SCHEMA_REGISTRY_KAFKASTORE_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
    volumes: *kafka-client-volume
    depends_on:
      kafka-acl-init:
        condition: service_completed_successfully

  # kafka-ui reads its cluster config from a file that speaks PLAINTEXT; it is
  # parked in this mode rather than given admin credentials.
  kafka-ui:
    profiles: ["kafka-ui-plaintext"]

  transaction-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev,kafka-secure
      KAFKA_SASL_USERNAME: svc_transaction
      KAFKA_SASL_PASSWORD: ${KAFKA_TRANSACTION_PASSWORD:-dev-kafka-transaction-secret}
    volumes: *kafka-client-volume

  budget-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev,kafka-secure
      KAFKA_SASL_USERNAME: svc_budget
      KAFKA_SASL_PASSWORD: ${KAFKA_BUDGET_PASSWORD:-dev-kafka-budget-secret}
    volumes: *kafka-client-volume

  notification-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev,kafka-secure
      KAFKA_SASL_USERNAME: svc_notification
      KAFKA_SASL_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD:-dev-kafka-notification-secret}
    volumes: *kafka-client-volume

  analytics-service:
    environment:
      SPRING_PROFILES_ACTIVE: dev,kafka-secure
      KAFKA_SASL_USERNAME: svc_analytics
      KAFKA_SASL_PASSWORD: ${KAFKA_ANALYTICS_PASSWORD:-dev-kafka-analytics-secret}
    volumes: *kafka-client-volume
