server:
  port: 8081

spring:
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/spendwise


  datasource:
    url: jdbc:postgresql://localhost:5432/spendwise
    username: nexaadmin
    password: Nexa@123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true

  flyway:
   enabled: true
   baseline-on-migrate: true
   baseline-version: 1

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.resource: TRACE
    root: INFO
    com.prathmesh.spendwise.userservice: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} : %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
      show-details: when_authorized
      probes:
        enabled: true