server:
  port: 8081

spring:
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/spendwise
    username: nexaadmin
    password: Nexa@123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true

  flyway:
   enabled: true
   baseline-on-migrate: true
   baseline-version: 1

logging:
  level:
    root: INFO
    com.prathmesh.spendwise.userservice: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} : %msg%n"