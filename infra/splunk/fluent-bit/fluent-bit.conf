# Fluent Bit — ships SpendWise container logs to Splunk's HTTP Event Collector.
# Reading, filtering and field naming live in infra/fluent-bit/pipeline.conf,
# shared with the Kibana shipper; only the destination is defined here.

[SERVICE]
    Flush             2
    Log_Level         info
    Parsers_File      /fluent-bit/etc/shared/parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    storage.path      /fluent-bit/state/buffer
    storage.sync      normal

@INCLUDE /fluent-bit/etc/shared/pipeline.conf

# Each record becomes one Splunk event whose body is the JSON object, so
# every field (service_name, log_level, correlationId, traceId, ...) is
# searchable. event time = Docker's timestamp for the line.
[OUTPUT]
    Name               splunk
    Match              docker.*
    Host               splunk
    Port               8088
    TLS                Off
    Splunk_Token       ${SPLUNK_HEC_TOKEN}
    Splunk_Send_Raw    Off
    event_index        spendwise
    event_sourcetype   spendwise:container
    event_host         spendwise-lab
    Retry_Limit        5
