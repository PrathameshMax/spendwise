global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Milestone 9 — every service now runs as its own container on this same
  # docker-compose network, so Prometheus reaches them by compose service name
  # (Docker's embedded DNS resolves it to the container's IP) instead of the
  # host.docker.internal indirection Milestones 3-5 needed for services still
  # running on the host via `mvn spring-boot:run`. This is the config for
  # Option A (docker compose up -d) only — Option B (services on the host)
  # still needs that host.docker.internal indirection, now covered by the
  # sibling prometheus-ide.yml (Milestone 13 fix) rather than being dropped.
  - job_name: spendwise-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: api-gateway
      - targets: ["auth-service:8081"]
        labels:
          service: auth-service
      - targets: ["user-service:8082"]
        labels:
          service: user-service
      - targets: ["transaction-service:8083"]
        labels:
          service: transaction-service
      - targets: ["budget-service:8084"]
        labels:
          service: budget-service
      - targets: ["analytics-service:8086"]
        labels:
          service: analytics-service

  # Milestone 18 — notification-service can run as several replicas (the
  # consumer-group chaos lab scales it to 4). A static target resolves the
  # compose service name to one replica per scrape, so counters from
  # different replicas would interleave in one series. DNS service discovery
  # (Docker's embedded DNS returns one A record per replica) scrapes every
  # replica as its own target instead; the `service` label matches the
  # static jobs above so dashboards and alerts treat it the same.
  - job_name: spendwise-notification-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["notification-service"]
        type: A
        port: 8085
        refresh_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: notification-service

  - job_name: spendwise-config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]
        labels:
          service: config-server

  # Milestone 10 — the Eureka registry itself is scraped exactly like every
  # other infrastructure module (config-server above), separately from the
  # business-service job so an outage of the registry doesn't get mixed into
  # `spendwise-services`' per-service dashboards.
  - job_name: spendwise-discovery-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-server:8761"]
        labels:
          service: discovery-server
