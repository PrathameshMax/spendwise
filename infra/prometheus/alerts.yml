groups:
  - name: spendwise-alerts
    rules:
      - alert: HighHttp5xxErrorRate
        expr: >
          (
            sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) by (service)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (service)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: >
            More than 5% of requests to {{ $labels.service }} have returned a 5xx
            status over the last 5 minutes (sustained for 2+ minutes).
