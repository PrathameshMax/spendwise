# Only the gateway is reachable from outside (through the ingress controller);
# every microservice is ClusterIP — no NodePort, no LoadBalancer, no public IP.
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: spendwise, labels: {app: api-gateway}}
spec:
  type: ClusterIP
  selector: {app: api-gateway}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: spendwise, labels: {app: user-service}}
spec:
  type: ClusterIP
  selector: {app: user-service}
  ports: [{name: http, port: 8082, targetPort: 8082}]
---
apiVersion: v1
kind: Service
metadata: {name: transaction-service, namespace: spendwise, labels: {app: transaction-service}}
spec:
  type: ClusterIP
  selector: {app: transaction-service}
  ports: [{name: http, port: 8083, targetPort: 8083}]
---
apiVersion: v1
kind: Service
metadata: {name: budget-service, namespace: spendwise, labels: {app: budget-service}}
spec:
  type: ClusterIP
  selector: {app: budget-service}
  ports:
    - {name: http, port: 8084, targetPort: 8084}
    - {name: grpc, port: 9090, targetPort: 9090}
---
apiVersion: v1
kind: Service
metadata: {name: analytics-service, namespace: spendwise, labels: {app: analytics-service}}
spec:
  type: ClusterIP
  selector: {app: analytics-service}
  ports: [{name: http, port: 8086, targetPort: 8086}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spendwise
  namespace: spendwise
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.nexacommerce.in]
      secretName: spendwise-tls
  rules:
    - host: api.nexacommerce.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api-gateway, port: {number: 8080}}
