# One Kubernetes service account per workload. It is the workload's identity in
# three places: the Istio mTLS certificate (spiffe://cluster.local/ns/spendwise/sa/<name>),
# Istio AuthorizationPolicies, and Vault's Kubernetes auth role for that service.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-gateway, namespace: spendwise}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: user-service, namespace: spendwise}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: transaction-service, namespace: spendwise}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: budget-service, namespace: spendwise}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: analytics-service, namespace: spendwise}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: notification-service, namespace: spendwise}
