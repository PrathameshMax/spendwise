# Fluent Bit — ships SpendWise container logs to Elasticsearch.
#
# Every line Docker writes for a container looks like:
#   {"log":"<what the app printed>\n","stream":"stdout","time":"...",
#    "attrs":{"com.docker.compose.service":"transaction-service","com.docker.compose.project":"spendwise"}}
# ("attrs" exists only for containers started with docker-compose.lab.yml).

[SERVICE]
    Flush             2
    Log_Level         info
    Parsers_File      /fluent-bit/etc/spendwise/parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    storage.path      /fluent-bit/state/buffer
    storage.sync      normal

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/state/tail.db
    Read_from_Head    On
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    storage.type      filesystem

# Bring the compose labels up to top-level fields.
[FILTER]
    Name              nest
    Match             docker.*
    Operation         lift
    Nested_under      attrs
    Add_prefix        attr_

[FILTER]
    Name              modify
    Match             docker.*
    Rename            attr_com.docker.compose.service  container_name
    Rename            attr_com.docker.compose.project  compose_project

# Keep SpendWise containers only (started with docker-compose.lab.yml). Logs of
# Elasticsearch, Kibana and Fluent Bit itself carry no compose_project and are
# dropped, so the log platform never ingests its own chatter.
[FILTER]
    Name              grep
    Match             docker.*
    Regex             compose_project .+

# Spring services print one ECS JSON object per line: turn it into fields.
# Lines that are not JSON (Postgres, Kafka, Redis...) keep their text in "log".
[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            ecs_json
    Reserve_Data      On

# The app's own @timestamp would clash with the one Elasticsearch output
# writes from the Docker timestamp (same instant, nanosecond precision).
[FILTER]
    Name              modify
    Match             docker.*
    Rename            @timestamp  app_timestamp
    Remove            time

[OUTPUT]
    Name               es
    Match              docker.*
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    spendwise-logs
    Suppress_Type_Name On
    # "log.level" -> "log_level", "service.name" -> "service_name": flat field
    # names avoid object/text mapping clashes between JSON and plain-text lines.
    Replace_Dots       On
    Generate_ID        On
    Retry_Limit        5
    Trace_Error        On
