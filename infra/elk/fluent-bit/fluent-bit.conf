# Fluent Bit — ships SpendWise container logs to Elasticsearch.
# Reading, filtering and field naming live in infra/fluent-bit/pipeline.conf,
# shared with the Splunk shipper; only the destination is defined here.

[SERVICE]
    Flush             2
    Log_Level         info
    Parsers_File      /fluent-bit/etc/shared/parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    storage.path      /fluent-bit/state/buffer
    storage.sync      normal

@INCLUDE /fluent-bit/etc/shared/pipeline.conf

[OUTPUT]
    Name               es
    Match              docker.*
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    spendwise-logs
    Suppress_Type_Name On
    # Safety net for any other dotted key (MDC values, future ECS fields):
    # flat names avoid object/text mapping clashes in Elasticsearch.
    Replace_Dots       On
    Generate_ID        On
    Retry_Limit        5
    Trace_Error        On
