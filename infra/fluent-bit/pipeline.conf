# Shared Fluent Bit pipeline: read every container log, keep SpendWise
# containers, turn JSON log lines into fields with one naming scheme.
# Included by infra/elk/fluent-bit/fluent-bit.conf (-> Elasticsearch) and
# infra/splunk/fluent-bit/fluent-bit.conf (-> Splunk HEC), so Kibana and
# Splunk see exactly the same events and field names.
#
# Every line Docker writes for a container looks like:
#   {"log":"<what the app printed>\n","stream":"stdout","time":"...",
#    "attrs":{"com.docker.compose.service":"transaction-service","com.docker.compose.project":"spendwise"}}
# ("attrs" exists only for containers started with docker-compose.lab.yml).
#
# READ_FROM_HEAD (set by each compose file): On = also ship lines written
# before this shipper first started; Off = only new lines.

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    DB                /fluent-bit/state/tail.db
    Read_from_Head    ${READ_FROM_HEAD}
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    storage.type      filesystem

# Bring the compose labels up to top-level fields.
[FILTER]
    Name              nest
    Match             docker.*
    Operation         lift
    Nested_under      attrs
    Add_prefix        attr_

[FILTER]
    Name              modify
    Match             docker.*
    Rename            attr_com.docker.compose.service  container_name
    Rename            attr_com.docker.compose.project  compose_project

# Keep SpendWise containers only (started with docker-compose.lab.yml). Logs of
# Elasticsearch, Kibana, Splunk and Fluent Bit itself carry no compose_project
# and are dropped, so a log platform never ingests its own chatter.
[FILTER]
    Name              grep
    Match             docker.*
    Regex             compose_project .+

# Spring services print one ECS JSON object per line: turn it into fields.
# Lines that are not JSON (Postgres, Kafka, Redis...) keep their text in "log".
[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            ecs_json
    Reserve_Data      On

# One naming scheme on both platforms: the ECS keys Spring Boot writes with
# dots ("log.level") become underscores ("log_level"). The app's own
# @timestamp is kept as app_timestamp; the event time is Docker's timestamp.
[FILTER]
    Name              modify
    Match             docker.*
    Rename            @timestamp           app_timestamp
    Rename            log.level            log_level
    Rename            log.logger           log_logger
    Rename            service.name         service_name
    Rename            service.environment  service_environment
    Rename            service.version      service_version
    Rename            service.node.name    service_node_name
    Rename            process.pid          process_pid
    Rename            process.thread.name  process_thread_name
    Rename            error.type           error_type
    Rename            error.message        error_message
    Rename            error.stack_trace    error_stack_trace
    Rename            ecs.version          ecs_version
    Remove            time
